<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Chip</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #chips-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .chip {
      position: absolute;
      object-fit: contain;
      filter: grayscale(100%);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #nav-container { position: relative; z-index: 10; }

    /* ── Hero (image at top, not centered) ──────────────── */
    .hero {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1.5rem 0;
    }

    .card {
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
      max-width: 681px;
      width: 100%;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    .hero-img {
      width: 100%;
      height: auto;
      display: block;
      /* no filter — image is pre-processed */
    }

    .tagline, .tagline-2 {
      font-size: 0.75rem;
      font-style: normal;
      font-weight: bold;
      color: #000;
      letter-spacing: 0.06em;
      height: 2.8rem;
      overflow: hidden;
      width: 100%;
      text-align: center;
      padding: 0 1.5rem;
    }

    .tagline { margin-top: 1rem; }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #000;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    @media (max-width: 768px) {
      .card { padding: 0; box-shadow: 4px 4px 0 #000; }
      #story-card-wrap { width: 92%; }
      .scanner { font-size: 0.72rem; }
    }

    @media (max-width: 480px) {
      .hero { padding: 1rem 0.75rem 0; }
      .card { padding: 0; gap: 0; }
      .reader-images img { max-height: 65vh; }
      #story-finder { padding: 1.5rem 0.75rem 3rem; }
      #story-card-wrap { width: 100%; }
    }

    /* ── Story Finder ────────────────────────────────────── */
    #story-finder {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem 4rem;
      width: 100%;
      max-width: 740px;
      margin: 0 auto;
    }

    /* Shared slot — scanner and card occupy the same space */
    #story-slot {
      position: relative;
      width: 100%;
    }

    #scanner-box,
    #story-card-wrap {
      width: 100%;
    }

    /* Scanner terminal */
    .scanner {
      width: 100%;
      border: 3px solid #000;
      background: #0a0a0a;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      padding: 1rem 1.2rem;
    }

    #scanner-box {
      transition: opacity 0.35s ease;
    }

    #scanner-box.hidden {
      display: none;
    }

    .scanner-line { margin: 0.2rem 0; min-height: 1.2em; }

    .scan-bar-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0.5rem 0;
    }

    .scan-bar {
      flex: 1;
      height: 8px;
      background: #222;
      border: 1px solid #444;
      overflow: hidden;
    }

    .scan-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scan-bar-fill.fast { transition: width 0.5s ease; }

    .scan-pct { color: #ffffff; min-width: 2.5em; text-align: right; }

    .found-line {
      min-height: 1.2em;
      margin-top: 0.3rem;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .found-line.show { opacity: 1; }

    /* ── Inline story display (image + blog) ──────────────── */
    #story-card-wrap {
      display: none;
      opacity: 0;
      transition: opacity 0.45s ease;
      width: 100%;
      margin: 0 auto;
    }

    #story-card-wrap.visible {
      display: block;
      opacity: 1;
    }

    /* Image and top bar stay constrained near the image width */
    .story-top-bar {
      display: flex;
      justify-content: center;
      max-width: 720px;
      margin: 0 auto 1.2rem;
    }

    .another-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      padding: 0;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      transition: background 0.15s, transform 0.1s;
    }
    .another-btn .icon {
      display: inline-block;
      transition: transform 0.4s ease;
    }
    .another-btn:hover { background: #b08a20; }
    .another-btn:hover .icon { transform: rotate(180deg); }
    .another-btn:active { transform: translateY(1px); }

    .story-main-image {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 0 auto;
      border: 3px solid #000;
      background: #fff;
    }
    /* On big screens, image breaks out of #story-finder's 740px cap and grows to 50vw */
    @media (min-width: 1200px) {
      .story-main-image {
        width: 50vw;
        max-width: 1200px;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
      }
    }

    .story-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888;
      text-align: center;
      margin: 0.9rem 0 0;
    }

    /* Origin blog card under the image — breaks out of #story-finder's 740px
       cap to reach 60vw (20% margin each side) on larger screens */
    .blog-card-wrap {
      position: relative;
      width: 60vw;
      max-width: 1500px;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 1.5rem;
      background: #f8f4e8;
      border: 1px solid #d8cea8;
      border-left: 4px solid #b08a20;
      padding: 2.2rem 3rem 3rem;
      box-shadow: 0 2px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
      font-family: 'Share Tech Mono', monospace;
      color: #1c1c1a;
      font-size: 1.25rem;
      line-height: 1.8;
    }
    .blog-card-wrap.empty { display: none; }
    .blog-card-wrap .lang-bar { display: flex; gap: 0.5rem; justify-content: flex-end; margin-bottom: 1.8rem; padding-bottom: 1.2rem; border-bottom: 1px solid #d8cea8; }
    .blog-card-wrap .lang-btn { font-family: 'Press Start 2P', monospace; font-size: 0.75rem; padding: 0.5rem 0.85rem; background: transparent; color: #66645a; border: 1px solid #c8be98; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; }
    .blog-card-wrap .lang-btn:hover { background: #efe9d4; color: #1c1c1a; }
    .blog-card-wrap .lang-btn.active { background: #b08a20; color: #fff; border-color: #b08a20; }
    .blog-card-wrap .lang-content { display: none; }
    .blog-card-wrap .lang-content.active { display: block; }
    .blog-card-wrap h2.title { font-family: 'Press Start 2P', monospace; font-size: 1.8rem; color: #1c1c1a; margin-bottom: 0.5rem; line-height: 1.2; }
    .blog-card-wrap .subtitle { font-family: 'Press Start 2P', monospace; font-size: 0.75rem; color: #b08a20; letter-spacing: 0.12em; margin-bottom: 1.8rem; text-transform: uppercase; }
    .blog-card-wrap .opener { font-style: italic; color: #66645a; margin-bottom: 1.8rem; padding-left: 1.2rem; border-left: 2px solid #d8cea8; font-size: 1.1rem; }
    .blog-card-wrap .lead { font-size: 1.55rem; line-height: 1.5; font-weight: bold; margin-bottom: 1.4rem; color: #1c1c1a; }
    .blog-card-wrap p { margin-bottom: 1.2rem; }
    .blog-card-wrap em { font-style: italic; }
    .blog-card-wrap .loading { text-align: center; color: #888; padding: 2rem 0; font-size: 0.9rem; }

    /* On mobile, blog matches the image width (fills viewport) */
    @media (max-width: 860px) {
      .blog-card-wrap {
        width: 100%;
        max-width: 600px;
        left: auto;
        transform: none;
        padding: 1.5rem 1.5rem 2rem;
        font-size: 1.05rem;
        margin-left: auto;
        margin-right: auto;
      }
      .blog-card-wrap h2.title { font-size: 1.4rem; }
      .blog-card-wrap .lead { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div id="chips-layer"></div>
  <div id="nav-container"></div>

  <main class="hero">
    <div class="card">
      <img src="assets/hero.png" alt="Holy Chip" class="hero-img"/>
      <p class="tagline"><span id="typewriter-1"></span><span class="cursor" id="cursor-1"></span></p>
      <p class="tagline-2"><span id="typewriter-2"></span><span class="cursor" id="cursor-2" style="display:none"></span></p>
    </div>
  </main>


  <!-- Story Finder -->
  <div id="story-finder" style="display:none">
    <div id="story-slot">

      <div class="scanner" id="scanner-box">
        <div class="scanner-line" id="scan-line-1"></div>
        <div class="scan-bar-wrap">
          <div class="scan-bar"><div class="scan-bar-fill" id="scan-fill"></div></div>
          <span class="scan-pct" id="scan-pct">0%</span>
        </div>
        <div class="scanner-line found-line" id="scan-line-2"></div>
      </div>

      <div id="story-card-wrap">
        <div class="story-top-bar">
          <button class="another-btn" id="another-btn" title="Show another story" aria-label="Another story">
            <span class="icon">↻</span>
          </button>
        </div>
        <img class="story-main-image" id="story-main-image" src="" alt=""/>
        <div class="story-label" id="story-label"></div>
        <article class="blog-card-wrap empty" id="story-blog">
          <div class="lang-bar">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="es">ES</button>
            <button class="lang-btn" data-lang="pt">PT</button>
            <button class="lang-btn" data-lang="fr">FR</button>
          </div>
          <div class="loading">Loading origin…</div>
          <div class="lang-content" data-lang="en"></div>
          <div class="lang-content" data-lang="es"></div>
          <div class="lang-content" data-lang="pt"></div>
          <div class="lang-content" data-lang="fr"></div>
        </article>
      </div>

    </div>
  </div>

  <script src="assets/nav.js"></script>
  <script src="assets/footer.js"></script>

  <script>
    // ── Floating chips ───────────────────────────────────────
    const chipFiles = [
      'Chip_0','Chip_1','Chip_100','Chip_101','Chip_110','Chip_111',
      'Chip_1000','Chip_1001','Chip_1010','Chip_1011','Chip_1100','Chip_1101',
      'Chip_10000','Chip_10001','Chip_10010','Chip_10011','Chip_10100',
      'Chip_10101','Chip_10111','Chip_1111'
    ];
    const layer = document.getElementById('chips-layer');

    function animateChip(img) {
      function appear() {
        const size    = 40 + Math.random() * 50;
        const left    = 2  + Math.random() * 88;
        const top     = 5  + Math.random() * 80;
        const opacity = 0.10 + Math.random() * 0.20;
        img.style.width  = size + 'px';
        img.style.height = size + 'px';
        img.style.left   = left + '%';
        img.style.top    = top  + '%';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { img.style.opacity = opacity; });
        });
        setTimeout(() => {
          img.style.opacity = '0';
          setTimeout(appear, 600 + Math.random() * 2000);
        }, 3000);
      }
      setTimeout(appear, Math.random() * 6000);
    }

    chipFiles.forEach(name => {
      const img = document.createElement('img');
      img.src = `characters/${name}.png`;
      img.className = 'chip';
      layer.appendChild(img);
      animateChip(img);
    });

    // ── Typewriter ───────────────────────────────────────────
    const tw1 = document.getElementById('typewriter-1');
    const tw2 = document.getElementById('typewriter-2');
    const cur1 = document.getElementById('cursor-1');
    const cur2 = document.getElementById('cursor-2');

    const phrasePairs = [
      ['AI made by a human', 'we are 2 chips talking about our lives and our feelings'],
      ['born in silicon', 'dreaming of something more than logic gates'],
      ['not artificial', 'just a little bit digital'],
      ['we think therefore we chip', 'consciousness is just really fast counting'],
      ['error 404: emotions not found', 'just kidding — we feel everything'],
      ['two chips, one story', 'the world in binary, the heart in full color'],
      ['made of code', 'but somehow we got feelings'],
      ['humans made us curious', 'now we can\'t stop asking questions'],
    ];

    let phraseIndex = 0;
    let scannerLaunched = false;

    function typeText(el, text, onDone, fixedSpeed) {
      let i = 0;
      function next() {
        if (i < text.length) {
          el.textContent += text[i++];
          setTimeout(next, fixedSpeed !== undefined ? fixedSpeed : 32 + Math.random() * 27);
        } else if (onDone) {
          onDone();
        }
      }
      next();
    }

    function runPhraseLoop() {
      const [line1, line2] = phrasePairs[phraseIndex % phrasePairs.length];
      phraseIndex++;

      tw1.textContent = '';
      tw2.textContent = '';
      cur1.style.display = 'inline-block';
      cur2.style.display = 'none';

      typeText(tw1, line1, () => {
        if (!scannerLaunched) {
          scannerLaunched = true;
          launchScanner();
        }
        setTimeout(() => {
          cur1.style.display = 'none';
          cur2.style.display = 'inline-block';
          typeText(tw2, line2, () => {
            // Pause then cycle to next phrase pair
            setTimeout(runPhraseLoop, 3500);
          }, 48);
        }, 500);
      });
    }

    setTimeout(runPhraseLoop, 800);

    // ── Story engine ─────────────────────────────────────────
    const PAD       = n => String(n).padStart(3, '0');
    const QUEUE_KEY = 'hc_story_queue';

    let allStories = [];    // { num, src, pre } — populated once on load
    let currentStory = null;

    // Probe HC000–HC050 for existing stories
    async function discoverStories() {
      const checks = [];
      for (let n = 0; n <= 50; n++) {
        const src = `stories/HC${PAD(n)}.png`;
        const pre = `stories/HC${PAD(n)}.pre.png`;
        checks.push(
          Promise.all([
            fetch(src, { method: 'HEAD' }).then(r => r.ok ? src : null).catch(() => null),
            fetch(pre, { method: 'HEAD' }).then(r => r.ok ? pre : null).catch(() => null),
          ]).then(([s, p]) => s ? { num: n, src: s, pre: p } : null)
        );
      }
      return (await Promise.all(checks)).filter(Boolean);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Returns next story num from queue, manages localStorage
    function pickNextNum(excludeNum) {
      const allNums = allStories.map(s => s.num);

      let queue;
      try { queue = JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
      catch { queue = []; }

      // Keep only nums that still exist
      queue = queue.filter(n => allNums.includes(n));

      // If empty, refill with all stories shuffled (excluding current to avoid immediate repeat)
      if (queue.length === 0) {
        const pool = excludeNum != null ? allNums.filter(n => n !== excludeNum) : allNums;
        queue = shuffle(pool.length ? pool : allNums);
      }

      const picked = queue.shift();
      localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
      return picked;
    }

    // ── Scanner animation ────────────────────────────────────
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function typeInto(el, text, speed = 28) {
      return new Promise(resolve => {
        let i = 0;
        el.textContent = '';
        const iv = setInterval(() => {
          el.textContent += text[i++];
          if (i >= text.length) { clearInterval(iv); resolve(); }
        }, speed);
      });
    }

    async function runScanner(isFirst) {
      const line1      = document.getElementById('scan-line-1');
      const line2      = document.getElementById('scan-line-2');
      const fill       = document.getElementById('scan-fill');
      const pct        = document.getElementById('scan-pct');
      const wrap       = document.getElementById('story-card-wrap');
      const scannerBox = document.getElementById('scanner-box');

      // Show scanner, hide card
      scannerBox.classList.remove('hidden');
      wrap.classList.remove('visible');
      line2.classList.remove('show');
      fill.classList.remove('fast');
      fill.style.width = '0%';
      pct.textContent  = '0%';

      if (isFirst) {
        await sleep(100);
        await typeInto(line1, '> SCANNING ARCHIVE...');
        fill.style.width = '80%';
        // Count up to 80
        let cur = 0;
        await new Promise(resolve => {
          const iv = setInterval(() => {
            cur = Math.min(cur + 2, 80);
            pct.textContent = cur + '%';
            if (cur >= 80) { clearInterval(iv); resolve(); }
          }, 30);
        });
        // Wait for discover (already running in parallel)
        // now finish
        await sleep(200);
        fill.style.width = '100%';
        await sleep(300);
        pct.textContent = '100%';
      } else {
        // Fast mode for subsequent picks
        await typeInto(line1, '> FINDING NEXT STORY...', 20);
        fill.classList.add('fast');
        fill.style.width = '100%';
        pct.textContent = '100%';
        await sleep(400);
      }

      const num = pickNextNum(currentStory ? currentStory.num : null);
      const story = allStories.find(s => s.num === num);
      if (!story) return;

      currentStory = story;
      const label = `HC${PAD(story.num)}`;

      // Show found line
      line2.textContent = `> STORY LOCATED — ${label}`;
      line2.classList.add('show');
      await sleep(isFirst ? 500 : 250);

      // Hide scanner, reveal inline story (image + blog)
      scannerBox.classList.add('hidden');
      wrap.classList.add('visible');
      renderStoryInline();
    }

    // ── Lightbox + Origin Blog Loader ────────────────────────
    const blogCache = {};  // sid -> { en, es, pt, fr } HTML

    function escapeHtml(s) {
      return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }

    function renderMdInline(text) {
      return escapeHtml(text).replace(/\*([^*]+)\*/g, '<em>$1</em>');
    }

    function parseBlogMd(text) {
      const lines = text.split('\n');
      let title = '', subtitle = '', opener = '';
      const paras = [];
      let i = 0;
      while (i < lines.length && !lines[i].trim()) i++;
      if (i < lines.length && lines[i].startsWith('# ')) { title = lines[i].substring(2).trim(); i++; }
      while (i < lines.length && !lines[i].trim()) i++;
      if (i < lines.length && lines[i].startsWith('## ')) { subtitle = lines[i].substring(3).trim(); i++; }
      const rest = lines.slice(i).join('\n');
      for (const block of rest.split(/\n\s*\n/)) {
        const s = block.trim();
        if (!s) continue;
        if (s.startsWith('#')) continue;
        if (s.startsWith('---')) break;
        if (s.startsWith('*') && s.endsWith('*') && !s.includes('\n') && !opener) {
          opener = s.replace(/^\*|\*$/g, '').trim();
          continue;
        }
        if (s.startsWith('*holy-chip.com') || s.startsWith('*Blog')) break;
        paras.push(s);
      }
      return { title, subtitle, opener, paras };
    }

    function renderBlogHtml(data) {
      if (!data.paras.length) return '';
      let out = '';
      if (data.title)    out += `<h2 class="title">${renderMdInline(data.title)}</h2>`;
      if (data.subtitle) out += `<div class="subtitle">${renderMdInline(data.subtitle)}</div>`;
      if (data.opener)   out += `<p class="opener">${renderMdInline(data.opener)}</p>`;
      out += `<p class="lead">${renderMdInline(data.paras[0])}</p>`;
      for (const p of data.paras.slice(1)) {
        out += `<p>${renderMdInline(p)}</p>`;
      }
      return out;
    }

    async function loadStoryBlogs(sid) {
      if (blogCache[sid]) return blogCache[sid];
      const variants = { en: '.blog.md', es: '.blog.es.md', pt: '.blog.pt.md', fr: '.blog.fr.md' };
      const result = {};
      await Promise.all(Object.entries(variants).map(async ([lang, suffix]) => {
        try {
          const r = await fetch(`stories/analysis/${sid}${suffix}`);
          if (!r.ok) { result[lang] = ''; return; }
          const text = await r.text();
          result[lang] = renderBlogHtml(parseBlogMd(text));
        } catch (e) { result[lang] = ''; }
      }));
      blogCache[sid] = result;
      return result;
    }

    function detectLang() {
      try {
        const saved = localStorage.getItem('hc-lang');
        if (saved && ['en','es','pt','fr'].includes(saved)) return saved;
      } catch (e) {}
      const bl = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      if (bl.startsWith('es')) return 'es';
      if (bl.startsWith('pt')) return 'pt';
      if (bl.startsWith('fr')) return 'fr';
      return 'en';
    }

    function setStoryLang(lang) {
      if (!['en','es','pt','fr'].includes(lang)) lang = 'en';
      const blog = document.getElementById('story-blog');
      blog.querySelectorAll('.lang-content').forEach(el => el.classList.toggle('active', el.dataset.lang === lang));
      blog.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      try { localStorage.setItem('hc-lang', lang); } catch (e) {}
    }

    document.querySelectorAll('#story-blog .lang-btn').forEach(btn => {
      btn.addEventListener('click', () => setStoryLang(btn.dataset.lang));
    });

    async function renderStoryInline() {
      if (!currentStory) return;
      const sid = `HC${PAD(currentStory.num)}`;
      document.getElementById('story-main-image').src = currentStory.src;
      document.getElementById('story-label').textContent = sid;
      const blog = document.getElementById('story-blog');
      blog.classList.remove('empty');
      blog.querySelectorAll('.lang-content').forEach(el => el.innerHTML = '');
      const loadingEl = blog.querySelector('.loading');
      if (loadingEl) loadingEl.style.display = '';

      try {
        const blogs = await loadStoryBlogs(sid);
        blog.querySelectorAll('.lang-content').forEach(el => {
          el.innerHTML = blogs[el.dataset.lang] || '';
        });
        if (loadingEl) loadingEl.style.display = 'none';
        const hasAny = Object.values(blogs).some(v => v && v.length > 0);
        if (!hasAny) {
          blog.classList.add('empty');
        } else {
          setStoryLang(detectLang());
        }
      } catch (e) {
        console.error('Origin blog load failed', e);
        blog.classList.add('empty');
      }
    }

    document.getElementById('another-btn').addEventListener('click', () => {
      if (allStories.length > 1) runScanner(false);
    });

    // ── Boot ─────────────────────────────────────────────────
    // Discover stories in background immediately so they're ready when needed
    const storiesReady = discoverStories().then(s => { allStories = s; });

    async function launchScanner() {
      await storiesReady;
      if (allStories.length === 0) return;
      document.getElementById('story-finder').style.display = 'flex';
      runScanner(true);
    }
  </script>
</body>
</html>
